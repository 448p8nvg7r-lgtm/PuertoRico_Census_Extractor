[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "census-extractor"
version = "1.0.1"
description = "Search US Census Data API variables and extract them to CSV (CLI + web UI)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
    "pyyaml>=6.0",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
census-extract = "census_extractor.cli:main"

[tool.setuptools]
packages = ["census_extractor"]
